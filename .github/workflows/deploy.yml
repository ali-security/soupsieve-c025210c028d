name: deploy

on:
  workflow_dispatch: {}

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9.16
      - name: Package
        run: |
          # hatchling 1.14.0's plugin loader calls importlib.util after only
          # `import importlib`, so it needs that submodule already imported.
          mkdir -p "${RUNNER_TEMP}/pypreload"
          echo 'import importlib.util' > "${RUNNER_TEMP}/pypreload/sitecustomize.py"
          export PYTHONPATH="${RUNNER_TEMP}/pypreload"
          pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' --upgrade build hatchling==1.14.0
          python -m build -s -w --no-isolation
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
